<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1d4ed8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle (Material You adaptive icon style) -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Subtly elevated perimeter ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Outer Protective Shield Symbol -->
  <g filter="url(#shadow)">
    <path d="M256 96 L376 148 C376 270 256 364 256 364 C256 364 136 270 136 148 Z" 
          fill="url(#shieldGrad)" 
          stroke="#93c5fd" 
          stroke-width="6" 
          stroke-linejoin="round"/>
  </g>

  <!-- Inner Tech Pulse / Barcode & Circuit Lines -->
  <!-- Barcode pattern -->
  <rect x="200" y="180" width="12" height="70" rx="4" fill="#ffffff" opacity="0.95"/>
  <rect x="224" y="180" width="8" height="70" rx="3" fill="#ffffff" opacity="0.95"/>
  <rect x="242" y="180" width="18" height="70" rx="4" fill="#ffffff" opacity="0.95"/>
  <rect x="270" y="180" width="10" height="70" rx="3" fill="#ffffff" opacity="0.95"/>
  <rect x="290" y="180" width="14" height="70" rx="4" fill="#ffffff" opacity="0.95"/>

  <!-- Glowing Sensor Scan beam -->
  <line x1="170" y1="215" x2="342" y2="215" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- Success Check Node at Bottom Anchor -->
  <circle cx="256" cy="300" r="16" fill="#10b981"/>
  <path d="M250 300 L254 304 L263 294" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
